<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punjab Para Sports Association</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Preloader Stylesheet -->
  <link rel="stylesheet" href="assets/punjab-para-sports-preloader.css">

  <style>
    :root {
      --primary-blue: #0D47A1;
      --primary-yellow: #FFC107;
      --light-bg: #FFFFFF;
      --card-bg: #F8FAFC;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--light-bg);
      color: #0F172A;
      overflow-x: hidden;
    }

    /* Discreet Developer / Testing Floating Bar */
    .dev-controls-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 30px;
      z-index: 1000000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      font-size: 0.8rem;
    }

    .dev-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dev-btn:hover {
      background: #FFFFFF;
      color: var(--primary-blue);
    }

    .dev-btn.yellow-btn {
      background: var(--primary-yellow);
      color: #000000;
      border: none;
    }

    .dev-btn.yellow-btn:hover {
      background: #FFD54F;
    }

    /* Main Website Hero (Revealed after preloader) */
    .website-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    }

    .hero-container {
      max-width: 860px;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--primary-blue);
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }

    .hero-tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .hero-line {
      width: 40px;
      height: 2px;
      background: #CBD5E1;
    }

    .hero-tagline-text {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: #475569;
      text-transform: uppercase;
    }

    .hero-desc {
      font-size: 1.15rem;
      color: #475569;
      line-height: 1.7;
      max-width: 640px;
      margin: 0 auto 36px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .hero-btn {
      padding: 13px 28px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .hero-btn-primary {
      background: var(--primary-blue);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 14px rgba(13, 71, 161, 0.25);
    }

    .hero-btn-primary:hover {
      background: #1565C0;
      transform: translateY(-1px);
    }

    .hero-btn-secondary {
      background: #FFFFFF;
      color: #0F172A;
      border: 1px solid #CBD5E1;
    }

    .hero-btn-secondary:hover {
      background: #F8FAFC;
    }

    /* Preloader root container */
    #pps-preloader-root {
      position: fixed;
    }
  </style>
</head>
<body>

  <!-- Reusable Preloader DOM Element -->
  <div id="pps-preloader-root"></div>

  <!-- Main Website Content (Revealed after preloader completes) -->
  <main class="website-hero">
    <div class="hero-container">
      <h1 class="hero-title">PUNJAB PARA SPORTS</h1>
      <div class="hero-tagline">
        <span class="hero-line"></span>
        <span class="hero-tagline-text">STRONGER TOGETHER</span>
        <span class="hero-line"></span>
      </div>
      <p class="hero-desc">
        Welcome to the official state portal of Punjab Para Sports Association. Empowering athletes of determination across Punjab through athletic opportunity, state-of-the-art training, and inclusive sports competition.
      </p>

      <div class="hero-actions">
        <button class="hero-btn hero-btn-primary" onclick="triggerReplay()">Replay Preloader</button>
        <button class="hero-btn hero-btn-secondary" onclick="toggleSpeed()">Adjust Speed (<span id="speed-label">2.7s</span>)</button>
      </div>
    </div>
  </main>

  <!-- Discreet Developer Floating Control Bar for testing -->
  <aside class="dev-controls-bar" aria-label="Preloader Testing Controls">
    <button class="dev-btn yellow-btn" onclick="triggerReplay()">▶ Replay</button>
    <button class="dev-btn" onclick="toggleSpeed()">⚡ Speed</button>
    <button class="dev-btn" onclick="toggleReducedMotion()">♿ Reduced Motion</button>
  </aside>

  <!-- Preloader JS Component -->
  <script src="assets/punjab-para-sports-preloader.js"></script>

  <script>
    let currentDuration = 2.7;
    let preloaderInstance = null;

    function startPreloader() {
      preloaderInstance = new PunjabParaSportsPreloader({
        containerId: 'pps-preloader-root',
        duration: currentDuration,
        autoStart: true,
        useSessionStorage: false,
        showSkipButton: false,
        onComplete: () => {
          console.log('Punjab Para Sports preloader finished cleanly.');
        }
      });
    }

    function triggerReplay() {
      const root = document.getElementById('pps-preloader-root');
      root.innerHTML = '';
      root.className = '';
      startPreloader();
    }

    function toggleSpeed() {
      if (currentDuration === 2.7) {
        currentDuration = 1.5;
        document.getElementById('speed-label').innerText = '1.5s';
      } else {
        currentDuration = 2.7;
        document.getElementById('speed-label').innerText = '2.7s';
      }
      triggerReplay();
    }

    function toggleReducedMotion() {
      if (preloaderInstance) {
        preloaderInstance.finishImmediately();
      }
    }

    // Auto start on load
    window.addEventListener('DOMContentLoaded', () => {
      startPreloader();
    });
  </script>
</body>
</html>
